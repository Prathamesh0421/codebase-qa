[project]
name = "codeqa"
version = "0.1.0"
description = "Multi-agent RAG over source code with call-graph context expansion"
requires-python = ">=3.14"

dependencies = [
    # Parsing. Grammars ship queries/tags.scm, which is what makes
    # multi-language support one code path instead of one parser per language.
    #
    # Evaluated and rejected tree-sitter-language-pack (xberg-io) as a bulk
    # source of grammars: it downloads compiled native binaries at runtime
    # (DownloadManager / download_all), from a young, non-canonical publisher.
    # For a system that parses arbitrary untrusted third-party repositories,
    # that reintroduces exactly the supply-chain risk "tree-sitter parses but
    # never executes" is meant to rule out. Grammars are pinned individually
    # instead -- each compiled into its wheel at build time, no runtime fetch,
    # published by the tree-sitter org or the grammar's own maintainers.
    #
    # Tier 1 (definitions + @reference.call, verified against real tags.scm
    # content): python, javascript, go, java, rust, ruby, php.
    # Tier 2 (definitions only; call references added via a bundled override
    # in languages/queries/): typescript, cpp.
    # C# ships no tags.scm at all and has no override yet -- tier 3, detected
    # but not chunked at function granularity. See docs/deep-dive.html.
    "tree-sitter>=0.26",
    # Version floors are what was actually installed and verified against
    # (registry.py, tests/unit/test_languages.py) -- not a copy-pasted
    # round number. They vary because each grammar has its own release
    # cadence; tree-sitter-c-sharp in particular has not reached 0.25.
    "tree-sitter-python>=0.25",
    "tree-sitter-javascript>=0.25",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-go>=0.25",
    "tree-sitter-java>=0.23",
    "tree-sitter-rust>=0.24",
    "tree-sitter-ruby>=0.23",
    "tree-sitter-php>=0.24",
    "tree-sitter-cpp>=0.23",
    "tree-sitter-c-sharp>=0.23",

    # Storage. Raw psycopg over an ORM: the vector, RRF and recursive-CTE
    # queries are the interesting part, and an ORM would obscure them.
    "psycopg[binary,pool]>=3.3",
    "pgvector>=0.5",
    "redis>=6.0",

    # API
    "fastapi>=0.141",
    "uvicorn[standard]>=0.40",
    "sse-starlette>=3.0",
    "pydantic>=2.12",
    "pydantic-settings>=2.7",

    # Agents / LLM
    "langgraph>=1.2",
    "litellm>=1.96",

    # Observability
    "structlog>=25.1",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.52b0",
    "opentelemetry-exporter-otlp>=1.30",

    # CLI
    "typer>=0.15",
    "rich>=14.0",
]

[project.optional-dependencies]
# Local embeddings are used for development, CI and eval reproducibility. The
# deployed image omits this extra and uses a hosted embedding API instead,
# which keeps ~2GB of torch out of the production container.
local-embeddings = [
    "sentence-transformers>=5.7",
]

dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.0",
    "pytest-cov>=6.0",
    "httpx>=0.28",
    # Test-only: the reference implementation that the production Postgres
    # recursive-CTE traversal is differential-tested against.
    "networkx>=3.6",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
codeqa = "codeqa.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeqa"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: requires Postgres and Redis (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.14"
strict = true
